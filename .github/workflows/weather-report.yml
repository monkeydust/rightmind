name: Daily Crete weather report

on:
  schedule:
    # 06:00 UTC = 7am UK time during BST (summer). In winter (GMT) this
    # arrives at 6am; change to "0 7 * * *" from late October if preferred.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build weather report
        run: |
          python scripts/weather_report.py --dry-run > report.txt
          cat report.txt
      # Posting the report as an issue comment from github-actions[bot] with
      # an @mention makes GitHub email the full content to the mentioned
      # user's notification address - no SMTP credentials needed.
      - name: Deliver report via GitHub notification email
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8').trim();
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, labels: 'weather-report', state: 'open', per_page: 1,
            });
            let issue_number;
            if (issues.length) {
              issue_number = issues[0].number;
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo,
                title: 'Daily Crete weather report',
                labels: ['weather-report'],
                body: 'Daily Crete weather reports are posted below. ' +
                  'Each comment @mentions the repo owner, so GitHub emails ' +
                  'the report to their notification address for free.',
              });
              issue_number = issue.number;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '@monkeydust\n\n```\n' + report + '\n```',
            });
